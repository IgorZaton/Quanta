[project]
name = "quanta"
version = "0.1.0"
description = "Keras quantization visualization toolkit"
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn>=0.30.0",
  "numpy>=1.26.0",
  "tensorflow>=2.16.0",
  "pydantic>=2.7.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0.0",
  "httpx>=0.27.0",
  "pre-commit>=4.0.0",
  "commitizen>=3.0.0",
]
pt = [
  "torch>=2.1.0",
  "onnx>=1.16.0",
  "onnx2keras>=0.0.24",
  "tf-keras>=2.20.1",
]

[project.scripts]
quanta = "quanta.cli:main"

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "."}

[tool.setuptools.packages.find]
where = ["."]

[tool.setuptools.package-data]
"quanta.assets" = ["*.keras", "*.npy"]
"quanta.web" = ["index.html", "quanta-manta-icon.svg", "assets/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
